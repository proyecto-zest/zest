name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zest_test
          POSTGRES_USER: zest
          POSTGRES_PASSWORD: zest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zest -d zest_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://zest:zest@localhost:5432/zest_test?schema=public
      CORS_ORIGIN: http://localhost:5173
      AUTH0_DOMAIN: test.us.auth0.com
      AUTH0_AUDIENCE: https://api.zest.test
      AWS_S3_BUCKET: zest-images-test
      AWS_S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test-access-key-id
      AWS_SECRET_ACCESS_KEY: test-secret-access-key
      RUN_DATABASE_TESTS: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run prisma:migrate:deploy

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm test -- --coverage

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
